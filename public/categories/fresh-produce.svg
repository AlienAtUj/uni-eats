<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="512" height="512">
  <!-- Edge-to-edge pastel green background -->
  <rect width="84" height="84" fill="#c3e4af"/>

  <!-- 1. Back/Left Vertical Bok Choy Leaf -->
  <path d="M 22.5 40.5 C 18.5 38.5, 16.8 34, 17.5 29.8 C 14.5 26.5, 14.8 20.5, 18.2 17.2 C 20 13.2, 24.5 11.8, 28 13.5 C 31.5 12.2, 34.8 15.5, 34.5 19.5 C 36.8 22.5, 36.2 27.8, 33.8 30.8 C 34.5 34.5, 32.8 38.5, 29.5 40.5 Z"
        fill="#449d39" stroke="#285420" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- Left leaf light-green stem & veins -->
  <path d="M 23.2 48.5 L 23.8 38.5 L 25.8 18.5 L 27.8 38.5 L 28.2 48.5 Z"
        fill="#dcf2c4" stroke="none"/>
  <path d="M 25.8 31.5 L 21.2 26.8 M 25.8 25.8 L 21.8 21.5 M 26.2 31.5 L 30.8 26.8 M 26.2 25.8 L 30.2 21.5"
        stroke="#b8e292" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Outer stalk outline below the left leaf blade -->
  <path d="M 23.2 48.5 L 23.6 39.8 M 28.2 48.5 L 27.8 39.8"
        stroke="#285420" stroke-width="2.1" stroke-linecap="round"/>

  <!-- 2. Main Diagonal Bok Choy (Right Leaf + Bulb Stem) -->
  <!-- Right green leaf blade -->
  <path d="M 33.8 37.5 C 32.8 30.5, 34.2 23.2, 38.8 18.5 C 42 14, 47.8 13.2, 51.8 15.8 C 56 13.5, 61.8 15.5, 62.8 20.5 C 67 22, 69.2 27.2, 67.2 31.8 C 70.2 35.8, 69.2 42.2, 64.8 45.2 C 62.5 48.8, 56.5 50.2, 51 48.5 L 39 48.5 Z"
        fill="#449d39" stroke="#285420" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- Bulbous base & tapering central midrib fill -->
  <path d="M 19.5 64.5 C 15.8 60.5, 16.2 52.8, 22.2 47.2 C 27.8 42.2, 32.8 38.2, 35.2 35.5 L 53.5 19.5 L 39.5 39.2 C 42.8 38, 46.2 38, 48.8 39.5 C 45.2 42.2, 42.2 45.2, 39.5 48.8 C 35.2 54.5, 33.8 59.5, 29.8 62.8 C 25.8 66, 21.8 66.5, 19.5 64.5 Z"
        fill="#dcf2c4" stroke="none"/>

  <!-- Soft green shading on bottom-right of bulb -->
  <path d="M 21 64.5 C 24.5 65.5, 28.5 64, 32 59.5 C 35.5 55, 38.5 49, 43 44.5 L 40 48.5 C 35.2 54.5, 33.8 59.5, 29.8 62.8 C 25.8 66, 22.5 66, 21 64.5 Z"
        fill="#c4e6a2" stroke="none"/>

  <!-- Soft light-green veins inside right leaf -->
  <path d="M 41.5 31.2 L 40.5 22.5 M 46.5 26.2 L 45.8 19.5 M 40.5 34.5 L 51.5 31.2 M 45.5 29.2 L 55.8 26.5"
        stroke="#b8e292" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Dark green outer outline ONLY along the bulb exterior -->
  <path d="M 34.2 36.5 C 31.8 39.2, 27.5 42.5, 22.2 47.2 C 16.2 52.8, 15.8 60.5, 19.5 64.5 C 21.8 66.5, 25.8 66, 29.8 62.8 C 33.8 59.5, 35.2 54.5, 39.5 48.8 C 42.2 45.2, 45.2 42.2, 48.5 40.2"
        fill="none" stroke="#285420" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Root nub at bottom-left of bok choy -->
  <path d="M 17.5 59.8 C 15.8 61.2, 16.2 63.8, 17.8 65.2 C 19.5 66.8, 21.8 66.8, 23 65.2 Z"
        fill="#6aa84f" stroke="#285420" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- 3. Bright Red Tomato (front right) -->
  <ellipse cx="55.5" cy="55.5" rx="12.8" ry="12"
           fill="#ee3824" stroke="#3c241b" stroke-width="2.1"/>
  <!-- Subtle darker red crescent shading on right of tomato -->
  <path d="M 61 45.5 C 65.5 48, 67.2 53, 66.2 58 C 65.2 62.5, 61.5 65.8, 56.5 66.3 C 61 64, 63.5 59.5, 63.5 54.5 C 63.5 50.5, 62.5 47.5, 61 45.5 Z"
        fill="#d62818" stroke="none"/>
  <!-- Re-stroke tomato outline cleanly -->
  <ellipse cx="55.5" cy="55.5" rx="12.8" ry="12"
           fill="none" stroke="#3c241b" stroke-width="2.1"/>

  <!-- Tomato green calyx / stem star -->
  <path d="M 55.5 41.5 L 55.5 44.5 M 48.5 45.8 C 51 44.2, 53.5 44.2, 55.5 44.8 C 57.5 44.2, 60 44.2, 62.5 45.8 C 59.8 46.2, 58.2 47.2, 57.5 49 C 56.2 47.2, 54.8 47.2, 53.5 49 C 52.8 47.2, 51.2 46.2, 48.5 45.8 Z"
        fill="#399630" stroke="#285420" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
