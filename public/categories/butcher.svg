<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="512" height="512">
  <!-- Edge-to-edge pastel pink background -->
  <rect width="84" height="84" fill="#fbbbbb"/>

  <!-- 1. 3D Steak Side Wall (tan/brown depth) -->
  <path d="M 13.8 47.2 L 13.8 54.2 C 13.8 61.5, 22.8 64.5, 32.5 63.5 C 40.5 62.5, 45.5 58.8, 50.5 56 C 55.8 53.2, 62.2 51.5, 66.8 46.8 C 69.2 44.2, 70.2 41, 70.2 37.8 L 70.2 29.8 Z"
        fill="#cf8e78" stroke="#4a2521" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 2. Top Steak Surface (pale pink-white outer fat rim) -->
  <path d="M 38.2 19.2 C 42 13.2, 50.8 12.8, 59.2 16.5 C 67.5 20.2, 71.8 27.5, 69.8 34.5 C 68.2 40.5, 62.5 43.2, 55.5 45.8 C 48.5 48.2, 45.2 52.2, 39.2 55 C 31.2 58.5, 20.8 58, 15.8 52.5 C 12.2 48.5, 13.5 42.5, 19.2 38.8 C 25.2 35, 29.2 33.2, 32.8 28 C 35.2 24.5, 36.5 21.8, 38.2 19.2 Z"
        fill="#fde0dc" stroke="#4a2521" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 3. Inner Red Meat Body -->
  <path d="M 40.2 21.2 C 43.5 16.2, 50.8 15.8, 57.8 19 C 64.8 22.2, 68.2 28, 66.5 33.5 C 65 38.5, 59.8 40.8, 53.5 43.2 C 46.8 45.8, 43.5 49.5, 38 52 C 31.2 55, 22.5 54.5, 18.5 50.2 C 15.8 47.2, 16.8 42.8, 21.8 39.8 C 27.2 36.5, 31.2 34.5, 34.8 29.2 C 37.2 25.8, 38.5 23.5, 40.2 21.2 Z"
        fill="#ee3e32" stroke="none"/>

  <!-- 4. Marbling Lines & Fat Eye inside the meat -->
  <!-- Y-shaped marbling band -->
  <path d="M 47.2 16.5 L 51 27.2 M 51 27.2 L 66.8 32.5 M 51 27.2 L 43.8 36.2"
        stroke="#fde0dc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small fat ring at the Y-junction with red center -->
  <ellipse cx="51" cy="27.2" rx="3.4" ry="2.6" transform="rotate(-15 51 27.2)"
           fill="#ee3e32" stroke="#fde0dc" stroke-width="2.2"/>

  <!-- Lower-left marbling streak and oval spot -->
  <path d="M 38 45.5 L 43.5 48.2" stroke="#fde0dc" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="32" cy="46.8" rx="2.4" ry="1.6" fill="#fde0dc"/>
</svg>
