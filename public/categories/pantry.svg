  <ellipse cx="28.5" cy="26" rx="10" ry="2.8" fill="none" stroke="#a3a7b0" stroke-width="1.4"/>

  <!-- Jar (front right) -->
  <!-- Jar body -->
  <path d="M 41 36 C 39.5 38.5, 39 41, 39 44 L 39 64 C 39 67.5, 41.5 69.5, 45 69.5 L 65 69.5 C 68.5 69.5, 71 67.5, 71 64 L 71 44 C 71 41, 70.5 38.5, 69 36 Z"
