  <!-- Milk Bottle blue label band -->
  <path d="M 49.5 40.5 L 70.5 40.5 L 70.5 53.5 L 49.5 53.5 Z" fill="#51abe8" stroke="none"/>
  <!-- Darker blue right-side shadow on label -->
  <path d="M 65.5 40.5 L 70.5 40.5 L 70.5 53.5 L 65.5 53.5 Z" fill="#4196d1" stroke="none"/>

  <!-- Milk Bottle outer outline -->
  <path d="M 55 18.5 L 65 18.5 L 65.5 22.8 C 66.5 26.5, 70.5 30.8, 70.5 36.5 L 70.5 62.5 C 70.5 65, 68.8 66.5, 66.2 66.5 L 53.8 66.5 C 51.2 66.5, 49.5 65, 49.5 62.5 L 49.5 36.5 C 49.5 30.8, 53.5 26.5, 54.5 22.8 Z"
