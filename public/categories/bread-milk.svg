  <!-- Milk Bottle Cap -->
  <rect x="53.5" y="14.2" width="13" height="4.8" rx="2.2"
        fill="#66b5ed" stroke="#4f3b2d" stroke-width="2.1" stroke-linejoin="round"/>
</svg>
