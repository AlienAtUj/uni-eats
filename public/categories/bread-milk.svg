        fill="#fce7be" stroke="#b36a2c" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Re-stroke the outer left/bottom edge of the loaf with the main dark brown outline -->
  <path d="M 53.5 55.5 L 39.8 61.2 L 17.5 59.5 L 16.2 38.8 C 13.2 36.8, 12.5 32.5, 14.2 29 C 15.6 26.2, 18.8 25, 23 24.8"
        fill="none" stroke="#684326" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bread crumb texture dots -->
  <circle cx="22.5" cy="33.5" r="1.2" fill="#dfb783"/>
  <circle cx="31.5" cy="36.2" r="1.3" fill="#dfb783"/>
  <circle cx="26.8" cy="43.5" r="1.3" fill="#dfb783"/>
  <circle cx="33.5" cy="46.2" r="1.2" fill="#dfb783"/>
  <circle cx="21.2" cy="50.5" r="1.3" fill="#dfb783"/>
  <circle cx="30.8" cy="53.8" r="1.2" fill="#dfb783"/>
  <circle cx="19.5" cy="40.5" r="1.0" fill="#dfb783"/>

  <!-- 3. Milk Bottle body fill -->
  <path d="M 55 18.5 L 65 18.5 L 65.5 22.8 C 66.5 26.5, 70.5 30.8, 70.5 36.5 L 70.5 62.5 C 70.5 65, 68.8 66.5, 66.2 66.5 L 53.8 66.5 C 51.2 66.5, 49.5 65, 49.5 62.5 L 49.5 36.5 C 49.5 30.8, 53.5 26.5, 54.5 22.8 Z"
        fill="#fcfaf2" stroke="none"/>

  <!-- Subtle right-side shadow strip on milk bottle -->
  <path d="M 62.5 18.5 L 65 18.5 L 65.5 22.8 C 66.5 26.5, 70.5 30.8, 70.5 36.5 L 70.5 62.5 C 70.5 65, 68.8 66.5, 66.2 66.5 L 65.5 66.5 L 65.5 35 C 65.5 29.5, 63.2 25.5, 62.5 22.5 Z"
