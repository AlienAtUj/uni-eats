<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="512" height="512">
  <!-- Edge-to-edge pastel peach background (clipped by button rounded corners) -->
  <rect width="84" height="84" fill="#fbd6aa"/>

  <!-- 1. Bread Loaf 3D body (golden crust) -->
  <path d="M 19 25.5 C 24 21, 34 19.5, 44 19.8 C 51 20, 55.5 22.5, 56 27.5 C 56.5 31.5, 54.5 34.5, 53.5 36.2 L 53.5 55.5 L 39.8 61.2 L 17.5 59.5 L 16.2 38.8 C 13.2 36.8, 12.5 32.5, 14.2 29 C 15.2 26.8, 17 25.8, 19 25.5 Z"
        fill="#d98943" stroke="#684326" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Subtle darker shading on lower right of bread crust -->
  <path d="M 41 39 L 52.5 36 L 52.5 54.8 L 40.2 60.2 Z" fill="#c77632" stroke="none"/>

  <!-- 2. Bread Front Slice (cream interior with warm golden-brown inner crust line, dark outer contour) -->
