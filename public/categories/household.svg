<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="512" height="512">
  <rect width="84" height="84" fill="#bfe1f6"/>

  <!-- Toilet roll (back right) -->
  <path d="M 44 34 L 44 64 C 44 67.3, 51 70, 59 70 C 67 70, 72 67.3, 72 64 L 72 34 Z"
        fill="#ffffff" stroke="#24384d" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 66 37 L 72 34 L 72 64 C 72 66.2, 69.6 68.2, 66 69.2 Z" fill="#e3edf4"/>
  <!-- Quilting dots -->
  <circle cx="51" cy="46" r="1.1" fill="#c6d6e2"/>
  <circle cx="57" cy="50" r="1.1" fill="#c6d6e2"/>
  <circle cx="51" cy="55" r="1.1" fill="#c6d6e2"/>
  <circle cx="57" cy="59" r="1.1" fill="#c6d6e2"/>
  <circle cx="63" cy="46" r="1.1" fill="#c6d6e2"/>
  <circle cx="63" cy="55" r="1.1" fill="#c6d6e2"/>
  <path d="M 44 34 L 44 64 C 44 67.3, 51 70, 59 70 C 67 70, 72 67.3, 72 64 L 72 34"
        fill="none" stroke="#24384d" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Roll top with tube -->
  <ellipse cx="58" cy="34" rx="14" ry="5" fill="#ffffff" stroke="#24384d" stroke-width="2.2"/>
  <ellipse cx="58" cy="34" rx="5" ry="1.9" fill="#b98b5e" stroke="#24384d" stroke-width="1.6"/>

  <!-- Spray bottle (front left) -->
  <!-- Bottle body -->
  <path d="M 19 38 C 16.5 41, 15 45, 15 49 L 15 66 C 15 68.5, 17 70, 19.5 70 L 41.5 70 C 44 70, 46 68.5, 46 66 L 46 49 C 46 45, 44.5 41, 42 38 Z"
        fill="#3fb7a6" stroke="#24384d" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 39 40 C 41 43, 42 46, 42 49 L 42 66 C 42 67.6, 41.2 69, 40 70 L 41.5 70 C 44 70, 46 68.5, 46 66 L 46 49 C 46 45, 44.5 41, 42 38 Z"
        fill="#2f9a8b"/>
  <!-- Bottle label -->
  <rect x="20" y="50" width="21" height="13" rx="2.5" fill="#ffffff" stroke="#24384d" stroke-width="1.7"/>
  <!-- Sparkle on label -->
  <path d="M 30.5 52.5 L 31.6 55.4 L 34.5 56.5 L 31.6 57.6 L 30.5 60.5 L 29.4 57.6 L 26.5 56.5 L 29.4 55.4 Z"
        fill="#3fb7a6"/>
  <path d="M 19 38 C 16.5 41, 15 45, 15 49 L 15 66 C 15 68.5, 17 70, 19.5 70 L 41.5 70 C 44 70, 46 68.5, 46 66 L 46 49 C 46 45, 44.5 41, 42 38 Z"
        fill="none" stroke="#24384d" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="23" y="31.5" width="15" height="7" rx="1.5" fill="#ffffff" stroke="#24384d" stroke-width="2.2"/>
  <!-- Trigger head -->
  <path d="M 21 31.5 L 21 22 C 21 18.5, 24 16, 28 16 L 41 16 C 43 16, 44.5 17.3, 45 19 L 46.5 24 L 40 24 L 40 31.5 Z"
        fill="#f6a03b" stroke="#24384d" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Nozzle -->
  <rect x="46" y="18.5" width="5" height="5" rx="1" fill="#f6a03b" stroke="#24384d" stroke-width="2"/>
  <!-- Trigger -->
  <path d="M 36 24 C 37 28, 38.5 30, 41 31.5" fill="none" stroke="#24384d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Spray mist -->
  <circle cx="56" cy="17" r="1.3" fill="#24384d" opacity="0.55"/>
  <circle cx="58.5" cy="21" r="1.3" fill="#24384d" opacity="0.55"/>
  <circle cx="55.5" cy="24.5" r="1.1" fill="#24384d" opacity="0.45"/>
</svg>

